<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="referrer" content="no-referrer"><title>스크롤 너머, 나의 취미</title>
<style>
:root{font:16px/1.55 system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#192d2b;background:#f4f7f5;--ink:#0a6251;--bd:#cbd7d1}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:54px 22px 48px}header{margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3.25rem);line-height:1.13;letter-spacing:-.065em;margin:18px 0 12px;text-wrap:balance}small,.note{color:#50645e;font-size:.9rem}header small{font-variant-numeric:tabular-nums;letter-spacing:.02em}.box{background:#fff;border:1px solid #dce4df;border-radius:24px;padding:clamp(20px,5vw,38px);box-shadow:0 12px 40px #233d2d09}.top{display:flex;align-items:center;gap:14px;margin-bottom:9px}.top span{margin-left:auto;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}h2{font-size:1.38rem;margin:0;letter-spacing:-.045em}.steps{height:4px;display:flex;gap:5px;margin:0 0 24px}.steps i{flex:1;background:#e2e9e5;border-radius:2px}.steps .on{background:var(--ink)}.intro{margin:-6px 0 20px}.note{margin:6px 0 10px}fieldset{border:0;padding:0;margin:0 0 25px;min-width:0}legend{font-size:1.04rem;font-weight:680;line-height:1.45;padding:0;margin-bottom:9px;letter-spacing:-.025em;word-break:keep-all}input,select,button{font:inherit}input[type=text],select{width:100%;min-height:48px;border:1px solid var(--bd);border-radius:11px;background:#fff;color:#192d2b;padding:11px 13px}select{padding-right:34px}.opts{display:flex;flex-wrap:wrap;gap:7px}.opts label{position:relative;display:inline-flex;cursor:pointer}.opts input{position:absolute;opacity:0;width:1px;height:1px}.opts span{min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:11px;padding:8px 14px;color:#354a45}.opts input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:#064d40;background:#e4f3eb;font-weight:650}.opts input:focus-visible+span,input[type=text]:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #20877e;outline-offset:2px}.actions{display:flex;align-items:center;gap:10px;border-top:1px solid #e1e7e4;padding-top:20px}button{border:0;border-radius:11px;cursor:pointer;font-weight:700;min-height:47px;padding:0 24px}#back{background:#edf2ef;color:#26423a}#next{margin-left:auto;background:var(--ink);color:white;min-width:100px}button:disabled{opacity:.65;cursor:default}[hidden]{display:none!important}p[role=alert]{color:#a32927;margin:0 0 12px}.invalid{border-left:3px solid #bb302e;padding-left:12px}.foot{display:block;margin-top:18px;text-align:center}h2:focus{outline:none}@media(max-width:480px){main{padding:26px 14px}.box{border-radius:18px;padding:21px 16px}.actions button{flex:1}.opts span{padding:8px 11px}}@media(prefers-reduced-motion:no-preference){.opts span{transition:background .12s,border-color .12s}}
</style>
<main><header><small>2026. 12. 31. 마감</small><h1>스크롤 너머, 나의 취미</h1></header>
<section class="box"><div class="top"><h2 tabindex="-1" id="heading"></h2><span id="step"></span></div><div class="steps" aria-hidden="true"><i></i><i></i><i></i></div><p class="intro note" id="hint"></p>
<form id="form" method="post" autocomplete="off" accept-charset="utf-8" novalidate><div id="questions"></div><p id="error" role="alert"></p><div class="actions"><button id="back" type="button">이전</button><button id="next" type="submit">다음</button></div></form><noscript>설문을 열려면 자바스크립트를 켜 주세요.</noscript></section></main>
<script src="./connection.js"></script>
<script>
const items=[["이름","text"],["학년","p",["고등학교 1학년","고등학교 2학년","고등학교 3학년"]],["학교명","text"],["하루 평균 자유시간은 얼마나 됐나요?","s",["0분","0분 초과~30분 미만","30분~1시간 미만","1~2시간 미만","2~3시간 미만","3~4시간 미만","4시간 이상","잘 모르겠음"],"수업, 과제, 입시 공부, 수면 등 꼭 해야 했던 일은 제외해 주세요."],["평일 하루 평균 SNS와 유튜브를 얼마나 이용했나요?","s",["0분","0분 초과~30분 미만","30분~1시간 미만","1~2시간 미만","2~3시간 미만","3~4시간 미만","4시간 이상","잘 모르겠음"]],["주말 하루 평균 SNS와 유튜브를 얼마나 이용했나요?","s",["0분","0분 초과~30분 미만","30분~1시간 미만","1~2시간 미만","2~3시간 미만","3~4시간 미만","4시간 이상","잘 모르겠음"]],["이용시간은 어떻게 확인했나요?","p",["전부 기기 기록으로 확인","기록과 기억을 함께 사용","전부 기억으로 추정","이용하지 않음"]],["SNS와 유튜브를 이용한 가장 큰 목적은 무엇이었나요?","s",["재미있는 콘텐츠 보기","친구와 소통하거나 소식 보기","취미 정보나 방법 찾기","공부나 과제","뉴스나 생활 정보 찾기","내 콘텐츠 올리기","기타","이용하지 않음"]],["가장 많은 시간을 쓴 취미는 무엇인가요?","s",["운동","그림, 공예, 요리 등 만들기","악기 연주나 노래","독서나 글쓰기","외국어, 코딩 등 자발적 학습","산책, 캠핑 등 야외활동","영화, 음악, 공연 등 감상","디지털 게임","보드게임이나 퍼즐","친구를 직접 만나 시간 보내기","기타","취미활동을 하지 않음"]],["일주일 동안 모든 취미에 쓴 시간은 얼마나 됐나요?","s",["0분","0분 초과~1시간 미만","1~3시간 미만","3~5시간 미만","5~10시간 미만","10~20시간 미만","20시간 이상","잘 모르겠음"],"게임을 직접 한 시간은 포함하고, SNS와 유튜브를 본 시간은 제외해 주세요."],["지난 7일 동안 SNS나 유튜브에서 본 내용을 취미에 활용한 적이 있나요?","p",["있음","없음","기억 안 남"]],["지난 7일 동안 SNS나 유튜브를 보느라 하려던 취미를 미루거나, 하려던 것보다 짧게 한 적이 있나요?","p",["있음","없음","기억 안 남","하려던 취미가 없었음"]],["지난 일주일에 보낸 취미시간에 얼마나 만족했나요?","p",["매우 불만족","불만족","보통","만족","매우 만족","취미활동을 하지 않음"]]];
const connection=window.surveyConnection||{action:'',keys:[]};
const stages=[[0,3,"참여자 정보","이름은 결과 발표에 공개하지 않아요."],[3,8,"SNS와 유튜브","오늘을 제외한 지난 7일 기준이에요. 모든 기기의 SNS와 유튜브(쇼츠 포함) 시간을 합해 주세요. 카카오톡과 디스코드는 제외해요."],[8,13,"나의 취미","오늘을 제외한 지난 7일 동안의 경험을 골라 주세요."]];
const $=id=>document.getElementById(id),el=t=>document.createElement(t),f=$("form"),boxes=[];let stage=0,submitting=false;
function renderItem(q,i){const [title,kind,opts,desc]=q,b=el("fieldset"),l=el("legend"),key=connection.keys[i]||("q"+(i+1));l.id="label"+i;l.textContent=title;b.append(l);if(desc){const p=el("p");p.className="note";p.textContent=desc;b.append(p)}if(kind==="text"||kind==="s"){let e=el(kind==="text"?"input":"select");e.setAttribute("aria-labelledby",l.id);e.name=key;e.required=true;if(kind==="text"){e.type="text";e.maxLength=i===0?40:100}else{e.add(new Option("선택해 주세요",""));opts.forEach(o=>e.add(new Option(o,o)))}b.append(e)}else{const g=el("div");g.className="opts";opts.forEach(o=>{let lab=el("label"),inp=el("input"),s=el("span");inp.type="radio";inp.name=key;inp.value=o;inp.required=true;s.textContent=i===1?o.replace("고등학교 ",""):o;lab.append(inp,s);g.append(lab)});b.append(g)}$("questions").append(b);boxes.push(b)}
items.forEach(renderItem);
function show(s,focus){stage=s;const [a,b,title,hint]=stages[s];boxes.forEach((x,i)=>x.hidden=i<a||i>=b);$("heading").textContent=title;$("hint").textContent=hint;$("step").textContent=(s+1)+" / 3";document.querySelectorAll(".steps i").forEach((e,i)=>e.classList.toggle("on",i<=s));$("back").hidden=s===0;$("next").textContent=s===2?"제출":"다음";$("error").textContent="";if(focus){$("heading").focus();window.scrollTo(0,0)}}
function closed(){return Date.now()>=Date.parse("2027-01-01T00:00:00+09:00")}
function closeForm(){f.hidden=true;$("hint").textContent="2026년 12월 31일에 설문이 마감됐어요.";$("heading").textContent="설문 마감";$("step").hidden=true;document.querySelector(".steps").hidden=true}
$("back").onclick=()=>show(stage-1,true);
f.addEventListener("input",e=>{e.target.closest("fieldset")?.classList.remove("invalid");$("error").textContent=""});
f.onsubmit=e=>{e.preventDefault();if(submitting)return;if(closed()){closeForm();return}const [a,b]=stages[stage];for(let i=a;i<b;i++){const x=boxes[i];const v=x.querySelector("input[type=text],select,input:checked");if(!v||!v.value.trim()){x.classList.add("invalid");$("error").textContent="응답하지 않은 문항을 확인해 주세요.";x.querySelector("input,select").focus();return}if(v.type==="text")v.value=v.value.trim()}
if(stage<2){show(stage+1,true);return}if(!connection.action||connection.keys.length!==items.length){$("error").textContent="미리보기에서는 응답을 전송하지 않아요.";return}submitting=true;$("next").disabled=true;$("next").textContent="제출 중";f.action=connection.action;HTMLFormElement.prototype.submit.call(f)};
window.addEventListener("pageshow",()=>{submitting=false;$("next").disabled=false;if(closed())closeForm();else show(stage,false)});show(0,false);if(closed())closeForm();
</script></html>
